<!doctype html>
<html lang="uk">
<meta charset="utf-8">
<title>ЛР 03 — автентифікація</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  fieldset { margin-bottom: 1.5rem; }
  label { display: block; margin: 0.4rem 0; }
  input, select, textarea { width: 100%; box-sizing: border-box; }
  #session-state { font-weight: bold; }
  #profile, #create-result { white-space: pre-wrap; }
</style>
<h1>Навчальний сеанс</h1>
<p>Стан сеансу: <span id="session-state">перевірка…</span></p>

<fieldset>
  <legend>Реєстрація</legend>
  <form id="register">
    <label>Ім'я користувача <input name="userName" autocomplete="username" required></label>
    <label>Email <input name="email" type="email" autocomplete="email" required></label>
    <label>Ім'я для відображення <input name="displayName" required></label>
    <label>Пароль <input name="password" type="password" autocomplete="new-password" required></label>
    <button>Зареєструватися</button>
  </form>
  <pre id="register-result"></pre>
</fieldset>

<fieldset>
  <legend>Вхід</legend>
  <form id="login">
    <label>Ім'я <input name="userName" autocomplete="username" required></label>
    <label>Пароль <input name="password" type="password" autocomplete="current-password" required></label>
    <button>Увійти</button>
  </form>
  <pre id="result"></pre>
</fieldset>

<fieldset>
  <legend>Профіль</legend>
  <button id="me">Мій профіль</button>
  <button id="logout">Вийти</button>
  <pre id="profile"></pre>
</fieldset>

<fieldset>
  <legend>Новий інцидент</legend>
  <form id="create-incident">
    <label>Тема <input name="title" required></label>
    <label>Опис <textarea name="description" required></textarea></label>
    <label>Критичність
      <select name="severity" required>
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
        <option value="Critical">Critical</option>
      </select>
    </label>
    <label>Час настання <input name="occurredAtUtc" type="datetime-local" required></label>
    <button>Створити</button>
  </form>
  <pre id="create-result"></pre>
</fieldset>

<script src="auth-lab.js" type="module" defer></script>
</html>
