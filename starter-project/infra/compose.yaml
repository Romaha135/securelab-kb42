name: secure-lab

services:
  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: securelab
      POSTGRES_USER: securelab
      POSTGRES_PASSWORD: local-study-password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securelab -d securelab"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
